<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo + ' · Impresiones Majo'}">Impresiones Majo</title>
  <link rel="icon" type="image/png" th:href="@{/images/majo-logo.png}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<aside class="sidebar" th:fragment="nav">
  <a class="brand" th:href="@{/}"><img class="brand-logo" th:src="@{/images/majo-logo.png}" alt="Impresiones Majo"><span class="brand-name">IMPRESIONES<span>Majo</span></span><span class="brand-sub">PAPELERÍA · COPIAS · IDEAS</span></a>
  <button class="mobile-toggle btn btn-outline-light" type="button" aria-controls="navigation" aria-expanded="false">Menú</button>
  <nav id="navigation" aria-label="Navegación principal">
    <span class="nav-heading">OPERACIÓN DIARIA</span>
    <a th:href="@{/}" th:if="${@acceso.tiene('DASHBOARD_VER')}">Panel principal</a>
    <a th:href="@{/ventas}" th:if="${@acceso.tiene('VENTAS_VER_PROPIAS') or @acceso.tiene('VENTAS_VER_TODAS')}">Ventas</a>
    <a th:href="@{/compras}" th:if="${@acceso.tiene('COMPRAS_GESTIONAR')}">Compras</a>
    <a th:href="@{/inventario}" th:if="${@acceso.tiene('PRODUCTOS_VER')}">Inventario</a>
    <span class="nav-heading">CATÁLOGOS</span>
    <a th:href="@{/catalogos/productos}" th:if="${@acceso.tiene('PRODUCTOS_VER')}">Productos</a>
    <a th:href="@{/catalogos/servicios}" th:if="${@acceso.tiene('SERVICIOS_VER')}">Servicios de impresión</a>
    <a th:href="@{/catalogos/categorias}" th:if="${@acceso.tiene('CATEGORIAS_GESTIONAR')}">Categorías</a>
    <a th:href="@{/catalogos/proveedores}" th:if="${@acceso.tiene('PROVEEDORES_GESTIONAR')}">Proveedores</a>
    <span class="nav-heading">ADMINISTRACIÓN</span>
    <a th:href="@{/finanzas/gastos}" th:if="${@acceso.tiene('GASTOS_GESTIONAR')}">Gastos</a>
    <a th:href="@{/finanzas/capital}" th:if="${@acceso.tiene('CAPITAL_GESTIONAR')}">Aportes de capital</a>
    <a th:href="@{/finanzas/inversiones}" th:if="${@acceso.tiene('INVERSIONES_GESTIONAR')}">Inversiones</a>
    <a th:href="@{/reportes}" th:if="${@acceso.tiene('REPORTES_VER')}">Reportes</a>
    <a th:href="@{/usuarios}" th:if="${@acceso.tiene('USUARIOS_GESTIONAR')}">Usuarios</a>
  </nav>
  <form th:action="@{/logout}" method="post" class="logout"><span th:text="${usuarioActual}"></span><button class="btn btn-outline-light btn-sm">Cerrar sesión</button></form>
</aside>
<div th:fragment="flash" th:if="${exito}" class="alert alert-success" role="status" th:text="${exito}"></div>
<div th:fragment="pagos(nombre)" class="field"><label th:for="${nombre}">Método de pago</label><select class="form-select" th:id="${nombre}" th:name="${nombre}" required><option>EFECTIVO</option><option>TRANSFERENCIA</option><option>TARJETA</option><option>OTRO</option></select></div>
</body></html>
