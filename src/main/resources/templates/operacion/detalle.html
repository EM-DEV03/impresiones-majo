<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Detalle de operación')}"></head><body><aside th:replace="~{fragments :: nav}"></aside><main class="workspace">
<header class="page-header"><div><p class="eyebrow" th:text="${tipo}"></p><h1 th:text="${(tipo == 'ventas' ? 'Venta #' : 'Compra #') + registro.id}"></h1><p class="muted" th:text="${registro.fecha}"></p></div><div class="toolbar no-print"><button type="button" class="btn btn-outline-secondary print-button">Imprimir</button><a class="btn btn-outline-secondary" th:href="@{/{tipo}(tipo=${tipo})}">Volver</a></div></header>
<div th:replace="~{fragments :: flash}"></div><section class="surface"><div class="section-header"><span class="status" th:text="${registro.estado}"></span><span th:text="${registro.metodoPago}"></span></div>
<div class="table-responsive"><table class="table"><thead><tr><th>Artículo</th><th>Cantidad</th><th>Unitario</th><th>Subtotal</th></tr></thead><tbody>
<tr th:each="l:${lineas}"><td th:text="${tipo == 'ventas' ? l.descripcionSnapshot : l.nombre}"></td><td th:text="${@formato.cantidad(l.cantidad)}"></td><td th:text="${@formato.cop(tipo == 'ventas' ? l.precioUnitario : l.costo_unitario)}"></td><td th:text="${@formato.cop(l.subtotal)}"></td></tr></tbody></table></div>
<dl class="totals"><dt>Subtotal</dt><dd th:text="${@formato.cop(registro.subtotal)}"></dd><dt>Descuento</dt><dd th:text="${@formato.cop(registro.descuento)}"></dd><dt>Total</dt><dd class="total-value" th:text="${@formato.cop(registro.total)}"></dd>
<th:block th:if="${tipo == 'ventas'}"><dt>Valor recibido</dt><dd th:text="${registro.valorRecibido == null ? 'No aplica' : @formato.cop(registro.valorRecibido)}"></dd><dt>Cambio</dt><dd th:text="${@formato.cop(registro.cambio)}"></dd></th:block></dl><p th:text="${registro.observaciones}"></p>
<p th:if="${tipo == 'ventas' and registro.estado == 'ANULADA'}" class="alert alert-warning" th:text="${registro.motivoAnulacion}"></p>
<form class="no-print" th:if="${registro.estado == 'BORRADOR'}" th:action="@{/{tipo}/{id}/confirmar(tipo=${tipo},id=${registro.id})}" method="post" data-confirm="¿Confirmar esta operación y actualizar el inventario?"><button class="btn btn-primary">Confirmar operación</button></form>
<p class="small muted mt-3" th:if="${tipo == 'compras'}">Las compras confirmadas son definitivas. Cualquier corrección de existencias debe registrarse como ajuste con un motivo verificable.</p>
<details class="mt-4 no-print" th:if="${tipo == 'ventas' and registro.estado != 'ANULADA' and @acceso.tiene('VENTAS_ANULAR')}"><summary>Anular venta</summary><form th:action="@{/ventas/{id}/anular(id=${registro.id})}" method="post" data-confirm="¿Anular esta venta? Si está confirmada, se devolverán las existencias."><label for="motivo">Motivo obligatorio</label><textarea class="form-control" name="motivo" id="motivo" required maxlength="470"></textarea><button class="btn btn-danger mt-3">Anular venta</button></form></details>
</section><p class="small muted mt-3">Comprobante interno de Impresiones Majo.</p></main></body></html>
