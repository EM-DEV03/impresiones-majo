<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Usuarios')}"></head><body><aside th:replace="~{fragments :: nav}"></aside><main class="workspace">
<header class="page-header"><div><p class="eyebrow">ACCESO AL SISTEMA</p><h1>Usuarios y roles</h1><p class="muted">Administradores para la gestión integral y vendedores para la operación diaria.</p></div></header><div th:replace="~{fragments :: flash}"></div>
<section class="surface"><h2>Crear usuario</h2><form th:action="@{/usuarios/crear}" method="post"><div class="form-grid">
<div class="field"><label for="username">Usuario</label><input class="form-control" id="username" name="username" required pattern="[a-zA-Z0-9._-]{3,60}" maxlength="60" autocomplete="off"></div>
<div class="field"><label for="nombre">Nombre completo</label><input class="form-control" id="nombre" name="nombre" required maxlength="160"></div>
<div class="field"><label for="email">Correo (opcional)</label><input class="form-control" id="email" name="email" type="email" maxlength="160"></div>
<div class="field"><label for="password">Contraseña inicial</label><input class="form-control" id="password" name="password" type="password" required minlength="12" maxlength="72" autocomplete="new-password"><small class="muted">Mínimo 12 caracteres. Máximo 72 bytes UTF-8.</small></div>
<div class="field"><label for="rol">Rol</label><select class="form-select" id="rol" name="rol"><option>VENDEDOR</option><option>ADMINISTRADOR</option></select></div></div><button class="btn btn-primary mt-3">Crear usuario</button></form></section>
<section class="surface mt-4"><h2>Cuentas existentes</h2><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Usuario</th><th>Nombre / correo</th><th>Rol</th><th>Estado</th><th>Administrar</th></tr></thead><tbody><tr th:each="u:${usuarios}"><td th:text="${u.nombre_usuario}"></td><td><strong th:text="${u.nombre_completo}"></strong><small class="muted d-block" th:text="${u.email}"></small></td><td th:text="${u.rol}"></td><td th:text="${@formato.activo(u.activo)?'Activo':'Inactivo'}"></td><td><details><summary>Editar acceso</summary><form th:action="@{/usuarios/{id}/actualizar(id=${u.id})}" method="post"><label>Rol<select class="form-select" name="rol"><option th:selected="${u.rol == 'VENDEDOR'}">VENDEDOR</option><option th:selected="${u.rol == 'ADMINISTRADOR'}">ADMINISTRADOR</option></select></label><label class="d-block"><input type="checkbox" name="activo" value="true" th:checked="${@formato.activo(u.activo)}"> Cuenta activa</label><label>Nueva contraseña (opcional)<input class="form-control" name="password" type="password" minlength="12" maxlength="72" autocomplete="new-password"></label><button class="btn btn-outline-primary btn-sm mt-2">Guardar acceso</button></form></details></td></tr></tbody></table></div></section>
</main></body></html>
