<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head(${def.titulo})}"></head><body><aside th:replace="~{fragments :: nav}"></aside><main class="workspace">
<header class="page-header"><div><p class="eyebrow">FINANZAS DEL NEGOCIO</p><h1 th:text="${def.titulo}"></h1><p class="muted">Registra los recursos que entran y salen de tu negocio.</p></div></header><div th:replace="~{fragments :: flash}"></div>
<section class="surface"><h2>Nuevo registro</h2><form th:action="@{/finanzas/{ruta}/registrar(ruta=${def.ruta})}" method="post"><div class="form-grid">
<div class="field"><label th:for="${def.concepto}" th:text="${def.ruta == 'capital' ? 'Origen del aporte' : (def.ruta == 'inversiones' ? 'Equipo adquirido' : 'Concepto')}"></label><input class="form-control" th:id="${def.concepto}" th:name="${def.concepto}" required maxlength="180"></div>
<div class="field"><label th:for="${def.valor}">Valor (COP)</label><input class="form-control" th:id="${def.valor}" th:name="${def.valor}" type="text" inputmode="decimal" data-money="true" maxlength="32" placeholder="1.300" required></div>
<div class="field"><label for="fecha">Fecha</label><input class="form-control" id="fecha" name="fecha" type="date" th:value="${hoy}" th:max="${hoy}" required></div>
<div class="field"><label th:for="${def.metodo}">Método de pago</label><select class="form-select" th:id="${def.metodo}" th:name="${def.metodo}"><option>EFECTIVO</option><option>TRANSFERENCIA</option><option th:unless="${def.ruta == 'capital'}">TARJETA</option><option>OTRO</option></select></div>
<div class="field" th:if="${def.ruta == 'gastos'}"><label for="categoria">Categoría</label><select class="form-select" id="categoria" name="categoria"><option>ENERGIA</option><option>INTERNET</option><option>ARRIENDO</option><option>TRANSPORTE</option><option>MANTENIMIENTO</option><option>OTRO</option></select></div>
<th:block th:if="${def.ruta == 'inversiones'}"><div class="field"><label for="proveedor_id">Proveedor (opcional)</label><select class="form-select" name="proveedor_id" id="proveedor_id"><option value="">Sin proveedor</option><option th:each="p:${proveedores}" th:value="${p.id}" th:text="${p.nombre}"></option></select></div>
<div class="field"><label for="vida_util_meses">Vida útil estimada (meses)</label><input class="form-control" id="vida_util_meses" name="vida_util_meses" type="number" min="1" step="1"></div></th:block>
<div class="field"><label for="descripcion">Descripción / observaciones</label><textarea class="form-control" id="descripcion" name="descripcion" maxlength="500" rows="2"></textarea></div></div><button class="btn btn-primary mt-3">Guardar registro</button></form></section>
<section class="surface mt-4"><h2>Historial</h2><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Fecha</th><th>Concepto</th><th>Valor</th><th>Estado</th><th>Acciones / motivo</th></tr></thead><tbody>
<tr th:each="r:${filas}"><td th:text="${r[def.fecha]}"></td><td><strong th:text="${r[def.concepto]}"></strong><small class="d-block muted" th:text="${def.ruta == 'capital' ? r.observaciones : r.descripcion}"></small></td><td th:text="${@formato.cop(r[def.valor])}"></td><td><span class="status" th:text="${r.estado}"></span></td><td>
<details th:if="${r.estado == def.registrado}"><summary>Anular</summary><form th:action="@{/finanzas/{ruta}/{id}/anular(ruta=${def.ruta},id=${r.id})}" method="post" data-confirm="¿Anular este registro financiero?"><label>Motivo<input class="form-control" name="motivo" maxlength="470" required></label><button class="btn btn-outline-danger btn-sm mt-2">Confirmar anulación</button></form></details><span th:unless="${r.estado == def.registrado}" th:text="${r.motivo_anulacion}"></span>
</td></tr></tbody></table></div><p class="empty" th:if="${#lists.isEmpty(filas)}">No hay registros todavía.</p><p class="small muted">Últimos 500 registros. Las anulaciones conservan el historial.</p></section>
</main></body></html>
