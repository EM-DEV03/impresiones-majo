<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Iniciar sesión')}"></head>
<body class="login-body"><main class="login-card"><img class="login-logo" th:src="@{/images/majo-logo.png}" alt="Impresiones Majo"><p class="eyebrow">IMPRESIONES MAJO</p><h1>Un nuevo día para crear.</h1><p class="muted">Tu papelería, tus ideas y tus cuentas en un solo lugar.</p>
<div class="alert alert-danger" role="alert" th:if="${param.error}">Usuario o contraseña incorrectos, o cuenta inactiva.</div>
<div class="alert alert-success" th:if="${param.logout}">Tu sesión se cerró correctamente.</div>
<form th:action="@{/login}" method="post">
<label for="username">Usuario</label><input class="form-control" id="username" name="username" maxlength="60" autocomplete="username" required autofocus>
<label for="password">Contraseña</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
<button class="btn btn-primary w-100 mt-4">Iniciar sesión</button></form>
<p class="small muted mt-4">Papelería · Impresiones · Gestión del negocio</p></main></body></html>
